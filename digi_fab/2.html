
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>日常の行動観察</title>

<style>
body {
    font-family: sans-serif;
    margin: 30px;
    background-color: white;
    color: #333;
}

h1 {
    text-align: center;
}

h2 {
    border-bottom: 2px solid #333;
    padding-bottom: 5px;
}

.photos {
    display: flex;
    gap: 20px;
    justify-content: center;
}

.photos img {
    width: 48%;
    height: auto;
}

section {
    margin-top: 40px;
}

li {
    margin-bottom: 15px;
}
</style>

</head>

<body>

<h1>日常の行動観察</h1>

<h2>観察スケッチ</h2>

<div class="photos">
    <img src="images/ningenkansatu1.jpeg" alt="観察スケッチ1">
    <img src="images/ningenkansatu2.jpeg" alt="観察スケッチ2">
</div>

<section>
<h2>観察について</h2>

<p>
日常生活の中で、人が無意識にしている行動や何気ない仕草に注目した。
普段よく見かける行動を8つ選び、それぞれスケッチにまとめた。
</p>
</section>

<section>
<h2>観察した8つの行動</h2>

<ol>
    <li>話すときに口を押さえる</li>
    <li>座っているときに足を組む</li>
    <li>座っているときに貧乏ゆすりをする</li>
    <li>エスカレーターでずっとハグをしているカップル</li>
    <li>両手で指の関節を鳴らす</li>
    <li>髪の毛を触る</li>
    <li>頬杖をつく</li>
    <li>鼻歌を歌う</li>
</ol>

</section>

</body>
</html>
